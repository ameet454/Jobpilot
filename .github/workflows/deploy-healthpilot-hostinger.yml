# Builds HealthPilot and uploads it to Hostinger over FTP.
#
# One-time setup — GitHub repo → Settings → Secrets and variables → Actions:
#   FTP_SERVER          e.g. ftp.yourdomain.com  (hPanel → Files → FTP Accounts)
#   FTP_USERNAME        e.g. u123456789 or u123456789.yourdomain.com
#   FTP_PASSWORD        your FTP password
#   FTP_SERVER_DIR      optional, default "public_html/"  (use "public_html/health/" for a subfolder; keep the trailing /)
#   OPENROUTER_API_KEY  optional — enables AI photo logging & coach chat
#
# Runs on every push to master that touches healthpilot/, or manually from the Actions tab.
name: Deploy HealthPilot to Hostinger

on:
  push:
    branches: [master]
    paths: ['healthpilot/**', '.github/workflows/deploy-healthpilot-hostinger.yml']
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    defaults:
      run:
        working-directory: healthpilot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: healthpilot/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Write AI key config (server-only, blocked from the web by .htaccess)
        if: env.OPENROUTER_API_KEY != ''
        run: printf "<?php\ndefine('OPENROUTER_API_KEY', '%s');\n" "$OPENROUTER_API_KEY" > dist/api/config.php

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: healthpilot/dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
