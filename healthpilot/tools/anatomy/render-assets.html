<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><title>Render anatomy assets</title></head>
<body style="font: 13px system-ui; background: #eee">
<p>Renders exercise thumbnails and the body-map images from the real anatomy and sends them to
<code>save-server.mjs</code> (run <code>node tools/anatomy/save-server.mjs</code> first). Open via the Vite dev server:
<code>/tools/anatomy/render-assets.html</code>.</p>
<pre id="log"></pre>
<div id="out" style="display:flex;flex-wrap:wrap;gap:4px"></div>
<script type="module">
import * as THREE from 'three';
import { EXERCISES, headRole, seeThrough } from '/src/data/exercises.js';
import { rig } from '/src/lib/rig3d.js';
import { buildAnatomy, loadAnatomy, poseAnatomy } from '/src/components/anatomyModel.js';
import { buildProps, defaultView, framing, makeMaterials } from '/src/components/Exercise3D.jsx';

const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
const SAVE = 'http://127.0.0.1:5174/?name=';
const save = (name, dataUrl) => fetch(SAVE + name, { method: 'POST', body: dataUrl });
const show = (url, w) => { const i = new Image(); i.src = url; i.width = w; document.getElementById('out').append(i); };

const data = await loadAnatomy();
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
const lights = (scene) => {
  scene.add(new THREE.HemisphereLight('#ffffff', '#8a96a3', 1.3));
  const key = new THREE.DirectionalLight('#ffffff', 2.2); key.position.set(140, 300, 220); scene.add(key);
  const rim = new THREE.DirectionalLight('#9fc3ff', 0.9); rim.position.set(-200, 120, -180); scene.add(rim);
};

/** Trim transparent margins, then fit the content into a w×h frame with a little padding. */
function cropToContent(src, w, h) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const g = c.getContext('2d'); g.drawImage(src, 0, 0);
  const { data } = g.getImageData(0, 0, c.width, c.height);
  let x0 = c.width; let y0 = c.height; let x1 = 0; let y1 = 0;
  for (let y = 0; y < c.height; y += 1) for (let x = 0; x < c.width; x += 1) {
    if (data[(y * c.width + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  const pad = 6; const bw = x1 - x0 + 1; const bh = y1 - y0 + 1;
  const k = Math.min((w - 2 * pad) / bw, (h - 2 * pad) / bh);
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  out.getContext('2d').drawImage(c, x0, y0, bw, bh, (w - bw * k) / 2, (h - bh * k) / 2, bw * k, bh * k);
  return out.toDataURL('image/webp', 0.88);
}

/* ── Exercise thumbnails: the key pose, focus red, helpers orange ───── */
const THUMB_T = { deadlift: 0.15, 'barbell-row': 1, plank: 0.5 };
renderer.setPixelRatio(1);
renderer.setSize(720, 540);
for (const ex of EXERCISES) {
  const scene = new THREE.Scene(); lights(scene);
  const mat = makeMaterials(false);
  const { ox, cy, size } = framing(ex);
  const anatomy = buildAnatomy(data, (g) => (seeThrough(ex, g) ? mat.veil : mat[headRole(ex, g)]));
  scene.add(anatomy.mesh);
  const group = new THREE.Group(); scene.add(group);
  const update = buildProps(group, ex, mat, ox);
  const R = rig(ex, THUMB_T[ex.id] ?? 1, ox);
  poseAnatomy(anatomy, R); update(R);
  mat.primary.emissiveIntensity = 0.9; mat.secondary.emissiveIntensity = 0.35;
  const cam = new THREE.PerspectiveCamera(32, 320 / 240, 1, 4000);
  const { az, el } = defaultView(ex); const d = size * 2.35;
  const a = (az * Math.PI) / 180; const e = (el * Math.PI) / 180;
  cam.position.set(Math.cos(e) * Math.cos(a) * d, cy + Math.sin(e) * d, Math.cos(e) * Math.sin(a) * d);
  cam.lookAt(0, cy, 0);
  renderer.setClearColor(0x000000, 0);
  renderer.render(scene, cam);
  const url = cropToContent(renderer.domElement, 240, 180);
  show(url, 160);
  await save(`thumbs/${ex.id}.webp`, url);
  log(`thumb ${ex.id}`);
}

/* ── Body map: front + back, a lit "shade" image and a flat "id" image ── */
const MAP_POSE = { id: 'map', view: 'front', props: [], primary: [], secondary: [],
  A: { at: [150, 144], torso: -90, ua: 78, fa: 86, th: 92, sh: 90 }, B: { at: [150, 144], torso: -90, ua: 78, fa: 86, th: 92, sh: 90 } };
const keys = data[0].groups.map((g) => g.group).filter((g) => g !== 'bone' && g !== 'muscle');
const W = 300; const H = 600;
renderer.setSize(W, H);
for (const [view, x] of [['front', 1], ['back', -1]]) {
  for (const pass of ['shade', 'id']) {
    THREE.ColorManagement.enabled = pass === 'shade';
    renderer.outputColorSpace = pass === 'shade' ? THREE.SRGBColorSpace : THREE.LinearSRGBColorSpace;
    const scene = new THREE.Scene();
    if (pass === 'shade') lights(scene);
    const shadeMat = { muscle: new THREE.MeshStandardMaterial({ color: '#d9c4bc', roughness: 0.55 }), bone: new THREE.MeshStandardMaterial({ color: '#ece4d2', roughness: 0.7 }) };
    const black = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const anatomy = buildAnatomy(data, (g) => {
      if (pass === 'shade') return g === 'bone' ? shadeMat.bone : shadeMat.muscle;
      const i = keys.indexOf(g);
      return i < 0 ? black : new THREE.MeshBasicMaterial({ color: new THREE.Color((i + 1) * 7 / 255, 0, 0) });
    });
    scene.add(anatomy.mesh);
    poseAnatomy(anatomy, rig(MAP_POSE, 0));
    const cam = new THREE.OrthographicCamera(-52, 52, 104, -104, 1, 1000);
    cam.position.set(x * 400, 104, 0); cam.lookAt(0, 104, 0);
    renderer.setClearColor(0x000000, 0);
    renderer.render(scene, cam);
    const url = renderer.domElement.toDataURL(pass === 'shade' ? 'image/webp' : 'image/png', 0.9);
    show(url, 150);
    await save(`anatomy/map-${view}-${pass}.${pass === 'shade' ? 'webp' : 'png'}`, url);
    log(`map ${view} ${pass}`);
  }
}
await save('anatomy/map.json', JSON.stringify({ keys, step: 7 }));
log('DONE');
</script></body></html>
