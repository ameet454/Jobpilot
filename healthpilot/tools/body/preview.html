<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><title>Body preview</title></head>
<body style="margin:0;background:#fff">
<div id="out" style="display:flex;flex-wrap:wrap;gap:2px"></div>
<script type="module">
// Dev-only contact sheet: /tools/body/preview.html?ex=bench-press,back-squat&t=0,1
import * as THREE from 'three';
import { EXERCISE_BY_ID, EXERCISES, headRole } from '/src/data/exercises.js';
import { rig } from '/src/lib/rig3d.js';
import { buildBody, loadBody, poseBody, setHands, setRoles, setXray } from '/src/components/bodyModel.js';
import { anatomyMaterials, anatomyRole, buildAnatomy, loadAnatomy, poseAnatomy } from '/src/components/anatomyModel.js';
import { headRole as role2, seeThrough } from '/src/data/exercises.js';
import { addFloor, addStudio, buildProps, defaultView, framing, makeMaterials } from '/src/components/scene3d.js';

const q = new URLSearchParams(location.search);
const ids = q.get('ex') === 'all' ? EXERCISES.map((e) => e.id) : (q.get('ex') || 'bench-press').split(',');
const ts = (q.get('t') || '0,1').split(',').map(Number);
const W = +(q.get('w') || 360), H = +(q.get('h') || 300);
const data = await loadBody();
const XR = +(q.get('xray') || 0);
const adata = XR ? await loadAnatomy() : null;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = +(q.get('exp') || 1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
for (const id of ids) for (const t of ts) {
  const ex = id === 'rest' ? null : EXERCISE_BY_ID[id];
  const scene = new THREE.Scene(); scene.background = new THREE.Color(q.get('bg') || '#eef0f3');
  addStudio(renderer, scene);
  const mat = makeMaterials(false);
  const body = buildBody(data);
  scene.add(body.mesh);
  let cy = 0, size = 240, az = +(q.get('az') ?? 30), el = +(q.get('el') ?? 8);
  if (ex) {
    setRoles(body, (h) => headRole(ex, h));
    setHands(body, ex.hands || (q.get('flat') ? 'flat' : 'fist'));
    body.uniforms.glow.value = 0.8;
    const f = framing(ex); cy = f.cy; size = f.size;
    if (!ex.noFloor) addFloor(scene, mat);
    const g = new THREE.Group(); scene.add(g);
    const up = buildProps(g, ex, mat, f.ox);
    const R = rig(ex, t, f.ox); poseBody(body, R); up(R);
    if (XR) {
      setXray(body, XR);
      const am = anatomyMaterials(false);
      am.primary.emissiveIntensity = 1.2; am.secondary.emissiveIntensity = 0.25;
      const an = buildAnatomy(adata, (g) => am[anatomyRole(ex, g, role2, seeThrough)]);
      scene.add(an.mesh); poseAnatomy(an, R);
    }
    if (!q.get('az')) ({ az, el } = defaultView(ex));
  } else {
    body.skeleton.bones.forEach((b, i) => b.matrixWorld.copy(body.skeleton.boneInverses[i]).invert());
    cy = -10;
  }
  if (q.get('cy')) cy = +q.get('cy');
  if (q.get('size')) size = +q.get('size');
  const cam = new THREE.PerspectiveCamera(30, W / H, 1, 5000);
  const d = size * 2.55, a = az * Math.PI / 180, e = el * Math.PI / 180;
  cam.position.set(Math.cos(e) * Math.cos(a) * d, cy + Math.sin(e) * d, Math.cos(e) * Math.sin(a) * d);
  cam.lookAt(0, cy, 0);
  renderer.render(scene, cam);
  const fig = document.createElement('figure'); fig.style.margin = 0; fig.style.font = '11px system-ui';
  const img = new Image(); img.src = renderer.domElement.toDataURL(); fig.append(img);
  const cap = document.createElement('figcaption'); cap.textContent = `${id} t=${t}`; fig.append(cap);
  document.getElementById('out').append(fig);
}
document.body.dataset.done = '1';
</script>
</body></html>
